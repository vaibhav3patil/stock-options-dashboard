universe:
  csv_path: fno_only_stocks.csv
  index_symbols:
    - NIFTY
    - BANKNIFTY
    - FINNIFTY
    - MIDCPNIFTY
    - NIFTYNXT50
    - NIFTYFPI
  # Liquid starter set for fast Phase 1 scans (tune later)
  liquid_subset:
    - RELIANCE
    - TCS
    - INFY
    - HDFCBANK
    - ICICIBANK
    - SBIN
    - BHARTIARTL
    - ITC
    - LT
    - AXISBANK
    - KOTAKBANK
    - BAJFINANCE
    - MARUTI
    - SUNPHARMA
    - TITAN
    - ASIANPAINT
    - WIPRO
    - HCLTECH
    - NTPC
    - POWERGRID

liquidity:
  min_option_volume_atm_window: 500
  min_oi_atm_window: 2000
  max_bid_ask_pct_of_mid: 0.03
  atm_strike_window: 2
  require_bid_ask: false

volatility:
  iv_rank_lookback_days: 252
  max_iv_rank_naked: 50
  max_iv_percentile_naked: 50
  rich_iv_rank: 70
  hv_period: 20
  rich_iv_hv_ratio: 1.3

move_vs_premium:
  min_expected_to_be_ratio: 1.5
  atr_period: 14
  hold_days_assumption: 2

direction:
  rs_lookback_days: 20
  rs_short_lookback_days: 5
  sma_fast: 20
  sma_slow: 50
  bb_period: 20
  bb_std: 2.0
  squeeze_lookback: 120
  squeeze_percentile: 20

risk:
  max_premium_per_trade_inr: 15000
  max_concurrent_naked_buys: 3

cache_ttl_seconds:
  option_chain: 120
  ohlc_daily: 86400
  ban_list: 3600

scan:
  max_workers: 4
  chain_max_workers: 2
  ohlc_history_days: 400
  chain_request_pause_ms: 350
